name: cd

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build Notely
        run: scripts/buildprod.sh

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/1025113964941/locations/global/workloadIdentityPools/github/providers/my-repo"
          service_account: "cloud-run-deployer@notely-bootdev-512218.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: "Build Docker Image"
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-bootdev-512218/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-bootdev-512218/notely-ar-repo/notely:latest --region us-centeral1 --allow-unauthenticated --project notely-bootdev-512218 --max-instances=4
